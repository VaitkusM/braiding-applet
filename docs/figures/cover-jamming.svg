<title id="t">Cover factor and jamming</title>
<desc id="d">Left: a patch of the unrolled braid at α = 40° (two families of flat strips of width w, perpendicular spacing d = 4πr cos α / N). Right: cover factor versus braid angle for the app's defaults (N = 32, w = 5 mm, r = 30 mm) with the jamming angle.</desc>
