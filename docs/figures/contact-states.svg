<title id="t">Unilateral contact of the free yarn</title>
<desc id="d">Three computed configurations seen along the axis of a cylinder (where n is radial, so contact is decided in this plane): the free yarn pointing away from the surface (fell point pinned), tangent (g = 0), and a guide-point motion that would make the straight yarn cut the mandrel, so the fell point advances to the new tangency point.</desc>
