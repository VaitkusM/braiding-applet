<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">No slip as a friction-cone condition in the normal plane of the yarn</title>
<desc id="d">The surface reaction per unit length is f = T(κn n − κg b), parallel to −Ġ⊥. No slip means f lies inside the Coulomb cone of half-angle arctan μ about n. Computed samples: the steady helix on the reference cylinder, and two points of the default taper's transition.</desc>
