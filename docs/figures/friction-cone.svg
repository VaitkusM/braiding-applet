<text x="20" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"><tspan font-style="italic">f</tspan> = <tspan font-style="italic">T</tspan> (κ<tspan dy="3.9" font-size="9.75"><tspan font-style="italic">n</tspan></tspan><tspan dy="-3.9"> <tspan font-style="italic">n</tspan> − κ</tspan><tspan dy="3.9" font-size="9.75"><tspan font-style="italic">g</tspan></tspan><tspan dy="-3.9"> <tspan font-style="italic">b</tspan>)  ∥  −Ġ</tspan><tspan dy="3.9" font-size="9.75">⊥</tspan></text>
