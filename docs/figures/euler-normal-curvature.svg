<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">Normal curvature along a yarn as a function of the braid angle</title>
<desc id="d">Euler's formula at three points of the app's default mandrels: the taper's cylindrical part (K = 0), the bulge crest (K &gt; 0) and the waist centre (K &lt; 0). On the waist κn is negative below the angle α* = arctan √(−k_m/k_p): there a yarn cannot rest on the surface under tension.</desc>
